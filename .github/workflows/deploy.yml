name: Deploy (Cloudflare Pages)

# Rebuilds and deploys the site to Cloudflare Pages on every push to main,
# including the automated daily content commits. Requires the repository secret
# CLOUDFLARE_API_TOKEN (a Cloudflare API token with the "Cloudflare Pages: Edit"
# permission). The account id below is public (it appears in the dashboard URL).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cf-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 28bb557afadff6799f8775f0d89a395b
          command: pages deploy out --project-name=pauzalogica-ro --branch=main
